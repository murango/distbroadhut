<article class="window" id="win-location" role="dialog" style="top:76px;left:14vw;width:min(640px,94vw)!important">
  <div class="win-bar" onmousedown="startDrag(event,'win-location')" ontouchstart="startDragT(event,'win-location')">
    <div class="win-btns"><button class="wb wb-x" onclick="closeWin('location')"></button><button class="wb wb-m" onclick="minimiseWin('location')"></button><button class="wb wb-z" onclick="toggleMax('win-location')"></button></div>
    <span class="win-ttl">📍 Find Us</span>
  </div>
  <div class="win-body">
    <span class="wh-icon">📍</span>
    <h2 class="wh-title">Find Us</h2>
    <span class="wh-tag" style="color:var(--tag-teal)">Nairobi, Kenya</span>
    <p class="wh-desc">Broadhut Studio is based in Nairobi, Kenya. Email <a href="mailto:hello@broadhut.com" style="color:inherit;text-decoration:underline">hello@broadhut.com</a> or use the contact form to arrange a visit, a call or a free discovery conversation.</p>
    
    
    <div class="loc-map" aria-label="Map of Nairobi, Kenya">
      <button class="loc-load" type="button" data-map-btn onclick="loadMap(this)">🗺️ Load interactive map<small>Loads a map from OpenStreetMap</small></button>
      <iframe data-lazy-src="https://www.openstreetmap.org/export/embed.html?bbox=36.7819%2C-1.3121%2C36.8619%2C-1.2721&amp;layer=mapnik&amp;marker=-1.2921%2C36.8219" title="Map of Nairobi, Kenya" hidden loading="lazy" referrerpolicy="no-referrer" width="100%" height="300" frameborder="0"></iframe>
    </div>
    <div class="cta-row">
      <a class="wh-cta" style="background:#2dd4bf;color:#04231f" href="https://www.google.com/maps/search/?api=1&amp;query=Nairobi%2C%20Kenya" target="_blank" rel="noopener">🧭 Open in Google Maps</a>
      <a class="wh-cta wh-cta-secondary" href="https://www.openstreetmap.org/?mlat=-1.2921&amp;mlon=36.8219#map=13/-1.2921/36.8219" target="_blank" rel="noopener">🌍 OpenStreetMap</a>
      <a class="wh-cta wh-cta-secondary" data-win="contact" href="/contact/">✉️ Contact us</a>
    </div>
  </div>
</article>
